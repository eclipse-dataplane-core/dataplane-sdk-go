# Configuration of the DPS TCK runtime (eclipsedataspacetck/dps-tck-runtime) for the data plane verification tests.
# The test passes the URL of the data plane under test and the authorization token as environment variables.

dataspacetck.test.package=org.eclipse.dataspacetck.dps.verification.dataplane
# the HTTP profile tests verify the HTTP wire protocol and its token renewal, which the SDK does not implement
dataspacetck.filters.tags.exclude=http-profile
dataspacetck.debug=true
dataspacetck.ansi=false

# The TCK cannot tell the data plane under test over HTTP how a test expects it to behave, so these tests signal it
# with a sentinel agreementId:
#   "async"    -> respond 202 with a transitional state, then send the prepared/started callback
#   "complete" -> send the completed callback once the data flow is started
DP_C_PULL_03_01_AGREEMENTID=complete
DP_C_PULL_04_01_AGREEMENTID=async
DP_P_PULL_04_01_AGREEMENTID=async
DP_C_PUSH_04_01_AGREEMENTID=async
DP_P_PUSH_03_01_AGREEMENTID=complete
DP_P_PUSH_04_01_AGREEMENTID=async
